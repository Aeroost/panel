name = "gateway-panel"
main = "src/index.ts"
compatibility_date = "2026-09-22"
workers_dev = true

# Copy the database_id and KV namespace id values produced by Wrangler.
# Do not commit real secrets here; use `wrangler secret put`.

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "panel-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "TEMP"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# No Durable Object binding is used in the control-plane phase.
# Tunnel/limiter bindings will be added only after phase-two approval.

[observability]
enabled = true
